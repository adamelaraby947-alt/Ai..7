<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK AI | المساعد الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* التنسيق الاحترافي */
        body {
            background-color: #080808;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .chat-container {
            width: 95%;
            max-width: 500px;
            height: 85vh;
            background: #121212;
            border: 1px solid #ffb300;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.15);
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .chat-header h2 {
            color: #ffb300;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* تنسيق الرسائل */
        .msg {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
        }

        .user-msg {
            background: #2c2c2c;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #444; 
        }

        .bot-msg {
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(255, 179, 0, 0.2);
        }

        /* منطقة الإدخال */
        .input-area {
            padding: 15px;
            background: #1a1a1a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 25px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        #userInput:focus {
            border-color: #ffb300;
            box-shadow: 0 0 5px rgba(255, 179, 0, 0.5);
        }

        #sendBtn {
            background: #ffb300;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: #000;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        #sendBtn:hover {
            transform: scale(1.1) rotate(-10deg);
            background: #ffcc00;
        }

        /* تصميم الـ Scrollbar */
        .chat-window::-webkit-scrollbar { width: 5px; }
        .chat-window::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2><i class="fas fa-bolt"></i> STARK AI</h2>
        </div>
        
        <div id="chat-window" class="chat-window">
            <div class="msg bot-msg">أهلاً يا STARK! أنا محدث بأحدث معلومات 2026، اسألني عن أي حاجة في الكوكب وهرد عليك.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="اكتب سؤالك بذكاء...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
<script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatWindow = document.getElementById('chat-window');

    async function askAI(question) {
        // هنستخدم محرك Pollinations لأنه شغال في مصر بطلقة ومن غير مفاتيح
        // غششناه التاريخ والمكان في السؤال عشان يعرف يجاوبك صح
        const date = new Date().toLocaleDateString('ar-EG');
        const context = `أجب كذكاء اصطناعي متطور في عام 2026. التاريخ اليوم هو ${date}. سؤال المستخدم هو: `;
        
        const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(context + question));
        
        if (!response.ok) throw new Error("السيرفر مشغول");
        return await response.text();
    }

    async function handleMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        chatWindow.innerHTML += `<div class="msg user-msg">${text}</div>`;
        userInput.value = "";
        chatWindow.scrollTop = chatWindow.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatWindow.innerHTML += `<div class="msg bot-msg" id="${loadingId}">... جاري التفكير</div>`;
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const aiResponse = await askAI(text);
            document.getElementById(loadingId).innerText = aiResponse;
        } catch (error) {
            document.getElementById(loadingId).innerText = "يا STARK، السيرفر عليه ضغط، جرب كمان ثانية.";
        }
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    sendBtn.onclick = handleMessage;
    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleMessage(); });
</script>


</body>
</html>
